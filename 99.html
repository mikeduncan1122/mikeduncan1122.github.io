*{

body{

body::before{
    content:"";
    position:fixed;
    top:-25%;
    left:-25%;
    width:150%;
    height:150%;
    background:
        radial-gradient(circle at 20% 20%, rgba(89, 89, 83, 0.4), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(89, 89, 83, 0.4), transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(89, 89, 83, 0.4), transparent 50%);
    animation: gradientMove 20s ease-in-out infinite alternate;
    z-index:-1;
}

@keyframes gradientMove{
    0%{
        transform:scale(1) translate(-50px,-30px);
    }
    100%{
        transform:scale(1.2) translate(50px,30px);
    }
}


.music-player{

.music-header{

.container{

<body>

<div class="container" id="window">

<script>
const win=document.getElementById('window');
let x=(window.innerWidth-win.offsetWidth)/2,y=(window.innerHeight-win.offsetHeight)/2;
let vx=0,vy=0,drag=false,ox=0,oy=0,lastX=0,lastY=0;
function draw(){
 win.style.left=x+'px'; win.style.top=y+'px'; win.style.transform=`rotate(${Math.max(-8,Math.min(8,vx*0.15))}deg)`;
}
win.style.position='absolute';draw();
function start(e){
 drag=true;const p=e.touches?e.touches[0]:e;
 ox=p.clientX-x;oy=p.clientY-y;lastX=p.clientX;lastY=p.clientY;vx=vy=0;
}
function move(e){
 if(!drag)return;
 const p=e.touches?e.touches[0]:e;
 x=p.clientX-ox;y=p.clientY-oy;
 vx=p.clientX-lastX;vy=p.clientY-lastY;
 lastX=p.clientX;lastY=p.clientY;
 draw(); if(e.cancelable)e.preventDefault();
}
function stop(){drag=false;}
win.addEventListener('mousedown',start);
document.addEventListener('mousemove',move);
document.addEventListener('mouseup',stop);
win.addEventListener('touchstart',start,{passive:false});
document.addEventListener('touchmove',move,{passive:false});
document.addEventListener('touchend',stop);
(function anim(){
 if(!drag){
   x+=vx;y+=vy;
   vx*=0.992;vy*=0.992;
   const loss=.88;
   if(x<0){x=0;vx=-vx*loss;}
   if(y<0){y=0;vy=-vy*loss;}
   if(x>innerWidth-win.offsetWidth){x=innerWidth-win.offsetWidth;vx=-vx*loss;}
   if(y>innerHeight-win.offsetHeight){y=innerHeight-win.offsetHeight;vy=-vy*loss;}
   draw();
 }
 requestAnimationFrame(anim);
})();
addEventListener('resize',()=>{x=Math.min(x,innerWidth-win.offsetWidth);y=Math.min(y,innerHeight-win.offsetHeight);draw();});


const playBtn = document.getElementById("playBtn");
const nextBtn = document.getElementById("nextBtn");
const prevBtn = document.getElementById("prevBtn");
const trackName = document.getElementById("trackName");
const audio = document.getElementById("audio");
const progressBar = document.getElementById("progressBar");
const currentTimeEl = document.getElementById("currentTime");
const durationEl = document.getElementById("duration");

// this is the playlist dont like put mp4s
const playlist = [
    "99m/highstakes.mp3",
    "99m/theworldisyours.mp3",
    "99m/walkin.mp3",
    "99m/frankenstein.mp3"
    "99m/19forever.mp3",
    
    
];

let current = 0;
let isPlaying = true;

function loadSong(index){
    const src = playlist[index];
    audio.src = src;

    
    trackName.textContent = src.split("/").pop().replace(".mp3", "");

    audio.loop = true;
    audio.volume = 0.15; 

    if(isPlaying){
        audio.play();
    }
}

function playSong(){
    isPlaying = true;
    audio.play();
}

function pauseSong(){
    isPlaying = false;
    audio.pause();
}

playBtn.onclick = () => {
    if(audio.paused){
        playSong();
    } else {
        pauseSong();
    }
};

nextBtn.onclick = () => {
    current = (current + 1) % playlist.length;
    loadSong(current);
    playSong();
};

prevBtn.onclick = () => {
    current = (current - 1 + playlist.length) % playlist.length;
    loadSong(current);
    playSong();
};


audio.onended = () => {
    nextBtn.click();
};
function formatTime(sec){
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s < 10 ? "0" + s : s}`;
}


audio.addEventListener("loadedmetadata", () => {
    durationEl.textContent = formatTime(audio.duration);
});


audio.addEventListener("timeupdate", () => {
    const percent = (audio.currentTime / audio.duration) * 100;
    progressBar.style.width = percent + "%";

    currentTimeEl.textContent = formatTime(audio.currentTime);
});
  document.querySelector(".progress-container").addEventListener("click", (e) => {
    const rect = e.target.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const width = rect.width;

    audio.currentTime = (clickX / width) * audio.duration;
});

loadSong(current);

const GRAVITY = 0.4;
const BOUNCE = 0.65;
const FRICTION = 0.99;
const COLLISION_DAMP = 0.7;

const physicsLayer = document.getElementById("physicsLayer");
const particles = [];
let draggedParticle = null;

const GITHUB_BASE = "";

function randomFrom(arr){
    return arr[Math.floor(Math.random() * arr.length)];
}

function getMusicRect(){
    const el = document.getElementById("music");
    if(!el)return null;
    const r = el.getBoundingClientRect();
    return { x: r.left, y: r.top, w: r.width, h: r.height };
}

function physicsUpdate(){
    const music = getMusicRect();

    for(let i = 0; i < particles.length; i++){
        const p = particles[i];
        if(p.drag) continue;
        p.vy += GRAVITY;
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= FRICTION;

        if(p.x < 0){ p.x = 0; p.vx = -p.vx * BOUNCE; }
        if(p.y < 0){ p.y = 0; p.vy = -p.vy * BOUNCE; }
        if(p.x + p.w > innerWidth){ p.x = innerWidth - p.w; p.vx = -p.vx * BOUNCE; }
        if(p.y + p.h > innerHeight){ p.y = innerHeight - p.h; p.vy = -p.vy * BOUNCE; }

        if(music){
            const cx = p.x + p.w/2, cy = p.y + p.h/2;
            const closestX = Math.max(music.x, Math.min(cx, music.x + music.w));
            const closestY = Math.max(music.y, Math.min(cy, music.y + music.h));
            const dx = cx - closestX;
            const dy = cy - closestY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const minDist = Math.max(p.w, p.h) / 2;

            if(dist < minDist){
                const overlap = minDist - dist;
                if(dist > 0){
                    const nx = dx / dist;
                    const ny = dy / dist;
                    p.x += nx * overlap;
                    p.y += ny * overlap;
                    const relVn = p.vx * nx + p.vy * ny;
                    if(relVn < 0){
                        p.vx -= relVn * nx * 1.2;
                        p.vy -= relVn * ny * 1.2;
                    }
                } else {
                    p.y -= overlap;
                    if(p.vy > 0) p.vy = -p.vy * BOUNCE;
                }
            }
        }

        p.el.style.left = p.x + "px";
        p.el.style.top = p.y + "px";
    }

    for(let i = 0; i < particles.length; i++){
        for(let j = i + 1; j < particles.length; j++){
            const a = particles[i], b = particles[j];
            if(a.drag || b.drag) continue;
            const aL = a.x, aR = a.x + a.w, aT = a.y, aB = a.y + a.h;
            const bL = b.x, bR = b.x + b.w, bT = b.y, bB = b.y + b.h;

            if(aR > bL && aL < bR && aB > bT && aT < bB){
                const overlapL = aR - bL;
                const overlapR = bR - aL;
                const overlapT = aB - bT;
                const overlapB = bB - aT;

                const overlapX = Math.min(overlapL, overlapR);
                const overlapY = Math.min(overlapT, overlapB);

                let nx, ny;
                if(overlapX < overlapY){
                    nx = overlapL < overlapR ? -1 : 1;
                    ny = 0;
                } else {
                    nx = 0;
                    ny = overlapT < overlapB ? -1 : 1;
                }

                const totalMass = a.mass + b.mass;
                const ratioA = b.mass / totalMass;
                const ratioB = a.mass / totalMass;

                if(nx !== 0){
                    const overlap = overlapL < overlapR ? overlapL : overlapR;
                    a.x += nx * overlap * ratioA;
                    b.x -= nx * overlap * ratioB;
                }
                if(ny !== 0){
                    const overlap = overlapT < overlapB ? overlapT : overlapB;
                    a.y += ny * overlap * ratioA;
                    b.y -= ny * overlap * ratioB;
                }

                const relVx = a.vx - b.vx;
                const relVy = a.vy - b.vy;
                const relVn = relVx * nx + relVy * ny;

                if(relVn < 0){
                    const impulse = -(1 + COLLISION_DAMP) * relVn / (1/a.mass + 1/b.mass);
                    a.vx += (impulse / a.mass) * nx;
                    a.vy += (impulse / a.mass) * ny;
                    b.vx -= (impulse / b.mass) * nx;
                    b.vy -= (impulse / b.mass) * ny;
                }
            }
        }
    }
}

document.addEventListener("mousemove", (e) => {
    for(const p of particles){
        if(p.drag){
            p.vx = e.clientX - p.lx;
            p.vy = e.clientY - p.ly;
            p.x = e.clientX - p.ox;
            p.y = e.clientY - p.oy;
            p.lx = e.clientX;
            p.ly = e.clientY;
            p.el.style.left = p.x + "px";
            p.el.style.top = p.y + "px";
        }
    }
});

document.addEventListener("touchmove", (e) => {
    const t = e.touches[0];
    for(const p of particles){
        if(p.drag){
            p.vx = t.clientX - p.lx;
            p.vy = t.clientY - p.ly;
            p.x = t.clientX - p.ox;
            p.y = t.clientY - p.oy;
            p.lx = t.clientX;
            p.ly = t.clientY;
            p.el.style.left = p.x + "px";
            p.el.style.top = p.y + "px";
        }
    }
}, {passive: false});

document.addEventListener("mouseup", () => {
    for(const p of particles){
        p.drag = false;
    }
});

document.addEventListener("touchend", () => {
    for(const p of particles){
        p.drag = false;
    }
});

(function physicsLoop(){
    physicsUpdate();
    requestAnimationFrame(physicsLoop);
})();
</script>
